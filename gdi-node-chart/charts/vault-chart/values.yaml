image:
  repository: hashicorp/vault
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    api: 8200

global:
  namespace: gdi-node

vault:
  rootToken: vault-root-token  # This should be set securely

config:
  path: "/vault/config"
  content: |
    {
      "storage": { "file": { "path": "/vault/file" } },
      "listener": [{ "tcp": { "address": "0.0.0.0:8200", "tls_disable": true } }],
      "default_lease_ttl": "168h",
      "max_lease_ttl": "720h",
      "ui": true
    }
