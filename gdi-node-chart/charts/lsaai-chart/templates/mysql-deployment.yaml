# templates/mysql-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lsaai-chart.fullname" . }}-mysql
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ include "lsaai-chart.fullname" . }}-mysql
  template:
    metadata:
      labels:
        app: {{ include "lsaai-chart.fullname" . }}-mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database }}
            - name: MYSQL_ROOT_HOST
              value: "{{ .Values.mysql.rootHost }}"
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.mysql.rootPassword }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.user }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.mysql.password }}
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-script
          configMap:
            name: {{ include "lsaai-chart.fullname" . }}-mysql-init
