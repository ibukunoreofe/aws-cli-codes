apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka-chart.fullname" . }}
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 9092
      targetPort: 9092
      protocol: TCP
      name: kafka
  selector:
    app: {{ include "kafka-chart.fullname" . }}
