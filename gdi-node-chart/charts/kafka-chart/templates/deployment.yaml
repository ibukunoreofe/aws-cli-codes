apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka-chart.fullname" . }}
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "kafka-chart.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "kafka-chart.fullname" . }}
    spec:
      containers:
        - name: kafka-broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 9092
          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-topics.sh
                - "--list"
                - "--bootstrap-server"
                - "localhost:9092"
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 20
            failureThreshold: 3
